[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plat"
version = "0.1.0"
description = "Personal AI-Driven Neurosurgical Knowledge Management System"
authors = [{name = "PLAT Team"}]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "chromadb>=0.4.17",
    "openai>=1.3.5",
    "google-generativeai>=0.3.1",
    "anthropic>=0.5.0",
    "sentence-transformers>=2.2.2",
    "transformers>=4.35.2",
    "pandas>=2.1.3",
    "numpy>=1.25.2",
    "beautifulsoup4>=4.12.2",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    "biopython>=1.81",
    "pubmed-lookup>=0.2.3",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "celery>=5.3.4",
    "redis>=5.0.1",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]