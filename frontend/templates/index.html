<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAT - Neurosurgical Encyclopedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Inline styles for demonstration */
        .jumbotron { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .search-result { border-left: 4px solid #0d6efd; background-color: #f8f9fa; padding: 1rem; margin-bottom: 1rem; border-radius: 0.375rem; }
        .paper-card { border: 1px solid #dee2e6; padding: 1rem; margin-bottom: 1rem; border-radius: 0.375rem; }
        .loading { text-align: center; padding: 2rem; }
        .stat-card { text-align: center; padding: 1.5rem; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; border-radius: 0.5rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-brain me-2"></i>PLAT</a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Hero Section -->
        <div class="jumbotron p-5 rounded-3 mb-4">
            <h1 class="display-4">Neurosurgical Encyclopedia</h1>
            <p class="lead">Personal AI-Driven Knowledge Management System</p>
            <p>Comprehensive, self-updating neurosurgical encyclopedia with 427+ concepts, powered by GPT-4, Gemini, and Claude.</p>
        </div>

        <!-- Search Section -->
        <section id="search" class="mb-5">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-search me-2"></i>Semantic Search</h3>
                </div>
                <div class="card-body">
                    <div class="input-group mb-3">
                        <input type="text" id="searchQuery" class="form-control" 
                               placeholder="Search neurosurgical concepts...">
                        <button class="btn btn-primary" onclick="performSearch()">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                    <div id="searchResults"></div>
                </div>
            </div>
        </section>

        <!-- Quick Stats -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <span class="stat-number">427+</span>
                    <div class="stat-label">Concepts</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <span class="stat-number">3</span>
                    <div class="stat-label">AI Providers</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <span class="stat-number">Live</span>
                    <div class="stat-label">PubMed Updates</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <span class="stat-number">24/7</span>
                    <div class="stat-label">Available</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple demo functions
        async function performSearch() {
            const query = document.getElementById('searchQuery').value;
            const resultsDiv = document.getElementById('searchResults');
            
            if (!query.trim()) {
                resultsDiv.innerHTML = '<div class="alert alert-warning">Please enter a search query.</div>';
                return;
            }
            
            resultsDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
            
            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, max_results: 10 })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    displaySearchResults(data.results);
                } else {
                    resultsDiv.innerHTML = '<div class="alert alert-danger">Search failed. Please try again.</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = '<div class="alert alert-danger">Connection error. Make sure the API server is running.</div>';
            }
        }
        
        function displaySearchResults(results) {
            const resultsDiv = document.getElementById('searchResults');
            
            if (results.length === 0) {
                resultsDiv.innerHTML = '<div class="alert alert-info">No results found. Try a different search term.</div>';
                return;
            }
            
            let html = `<h5>Found ${results.length} results:</h5>`;
            results.forEach(result => {
                html += `
                    <div class="search-result">
                        <div class="search-result-title">${result.title}</div>
                        <div class="search-result-meta">
                            <span class="badge bg-secondary">${result.content_type}</span>
                            <span class="badge bg-info">${result.category}</span>
                            <span class="badge bg-success">Confidence: ${(result.confidence_score * 100).toFixed(0)}%</span>
                            <span class="badge bg-warning">Similarity: ${(result.similarity_score * 100).toFixed(0)}%</span>
                        </div>
                        <div class="search-result-preview">${result.content_preview}</div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        // Allow Enter key to trigger search
        document.getElementById('searchQuery').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
